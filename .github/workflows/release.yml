name: Release

# Push a tag such as v1.0.0 to build the game for Windows and publish it as a
# GitHub release. Requires the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD
# repository secrets (see README).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test IversTales.sln --configuration Release

  build:
    name: Windows build
    needs: tests
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check Unity secrets
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Missing UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD secrets. See README > Continuous integration."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: IversTales/Library
          key: library-${{ hashFiles('IversTales/Assets/**', 'IversTales/Packages/**', 'IversTales/ProjectSettings/**') }}
          restore-keys: library-

      - uses: game-ci/unity-builder@v4
        with:
          projectPath: IversTales
          targetPlatform: StandaloneWindows64
          buildName: IversTales
          versioning: Tag

      - name: Package
        run: |
          cd build/StandaloneWindows64
          zip -qr "../../IversTales-${GITHUB_REF_NAME}-windows.zip" .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: IversTales-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
